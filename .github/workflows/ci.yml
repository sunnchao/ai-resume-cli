name: Python and OCR validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not ocr" --cov=resume_cli --cov-report=term-missing --junitxml=results/core.xml
      - run: uv build
      - run: uv run python scripts/verify_wheel.py dist/ai_resume_cli-0.6.0-py3-none-any.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ matrix.python }}
          path: results/core.xml

  ocr:
    name: OCR / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      UV_PYTHON: "3.11"
      RESUME_REQUIRE_OCR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --group dev --extra ocr
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install tesseract
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: uv run python scripts/install_ocr_languages.py --directory "${{ runner.temp }}/resume-tessdata"
      - run: uv run --extra ocr pytest -m ocr --junitxml=results/ocr.xml
        env:
          TESSDATA_PREFIX: ${{ runner.temp }}/resume-tessdata
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ocr-${{ matrix.os }}
          path: results/ocr.xml

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
